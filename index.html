<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>auto-trade</title></head><body style='font-family:sans-serif;text-align:center;padding:40px'><p id='m'>bot dashboard loading...</p><script>fetch('url.txt?_='+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(u=>{u=u.trim();if(u&&u.indexOf('http')===0){location.replace(u);}else{document.getElementById('m').textContent='bot url not found - is the PC bot running?';}}).catch(e=>{document.getElementById('m').textContent='connect fail: '+e;});</script></body></html>
