<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta name='theme-color' content='#0E1A3C'><link rel='manifest' href='manifest.json'><link rel='apple-touch-icon' href='icon-192.png'><title>자동매매</title></head><body style='font-family:sans-serif;text-align:center;padding:48px 24px'><h3 id='m'>연결 중…</h3><p id='s' style='color:#888;font-size:14px'></p><script>function go(){fetch('url.txt?_='+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(u=>{u=u.trim();if(u&&u.indexOf('http')===0){location.replace(u);}else{document.getElementById('m').textContent='봇 시작 대기 중…';document.getElementById('s').textContent='부팅 직후엔 1분쯤 걸립니다. 자동으로 연결돼요.';setTimeout(go,4000);}}).catch(e=>{document.getElementById('m').textContent='연결 대기 중…';document.getElementById('s').textContent='자동으로 다시 시도합니다.';setTimeout(go,4000);});}go();</script></body></html>
